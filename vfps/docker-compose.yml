
services:
  postgresql:
    image: docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    environment:
      # kics-scan ignore-line
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfps
    healthcheck:
      # over TCP: during init the image runs a temporary socket-only server that would pass a socket check
      test:
        - CMD
        - pg_isready
        - --host=127.0.0.1
        - --username=postgres
        - --dbname=vfps
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:35432:5432"
  vfps:
    image: ghcr.io/miracum/vfps:v1.23.0
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    environment:
      DOTNET_EnableDiagnostics: "0"
      ForceRunDatabaseMigrations: "true"
      ConnectionStrings__PostgreSQL: "Host=postgresql:5432;Database=vfps;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;Gss Encryption Mode=Disable;"
      PGUSER: postgres
      # kics-scan ignore-line
      PGPASSWORD: postgres
    ports:
    #  # Http1, Http2, Http3
      - "127.0.0.1:8090:8080"
    #  # Http2-only for plaintext gRPC
    #  - "127.0.0.1:8081:8081"
